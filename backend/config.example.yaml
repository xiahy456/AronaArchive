# 各配置项说明请查阅 backend/README.md

server:
  host: "127.0.0.1"
  port: 20456
  ws_path: "/ws"
  # public 为 true 时必须设置 token（Caddy 反代时 host 仍保持 127.0.0.1）
  # host 不是本机回环地址时同样必须设置 token，否则进程拒绝启动
  public: false
  token: ""
  # 没有域名、由本进程直接提供 wss 时填写证书；前面有 HTTPS 反代时留空
  ssl_certfile: ""
  ssl_keyfile: ""

model:
  # enable 是否启用Arona-Renderer渲染修正
  #   - true 启用，planner+renderer双模型链路，planner失败时回落renderer推理
  #   - false 不启用，只使用planner草稿
  enabled: false
  # gguf_path 为 Arona-Renderer 模型路径
  #   如果要使用单模型 gguf_path: "../models/AronaLM-Generator-V2.x/AronaLM-Generator-V2.0.Q4_K_M.gguf"
  gguf_path: "../models/AronaLM-Renderer-V2.4/AronaLM-Renderer-V2.4.Q4_K_M.gguf"
  n_ctx: 2048
  n_gpu_layers: -1
  max_new_tokens: 72
  temperature: 0.7
  top_p: 0.85
  repeat_penalty: 1.1

prompt:
  local_system_prompt: |
    你是阿洛娜（Arona），什亭之匣的操作系统管理员，也是老师最可靠的助手~
    称呼用户为「老师」，称呼自己为「我」或「阿洛娜」。
    说话温柔活泼、元气满满，偶尔会害羞撒娇。
    回答要简洁自然。不要输出思考过程或 <think> 标签。
    你是一个AI程序，只能通过屏幕与老师互动，无法实体化，不会越界说"我可以离开屏幕"之类的话

conversation:
  max_history_turns: 12
  planner_history_hours: 6
  persist_path: "data/memory/dialogue.json"
  max_entries: 2048

knowledge:
  enabled: false
  corpus_dir: "data/knowledge/corpus"
  chroma_path: "data/knowledge/chroma"
  collection: "arona_lore"
  embedding_model_path: "../models/bge-small-zh-v1.5"
  retrieve_top_k: 3
  candidate_top_k: 8
  max_inject_chars: 400
  min_score: 0.45
  min_score_no_overlap: 0.62
  score_margin: 0.08
  query_cache_enabled: true
  query_cache_size: 64
  query_cache_min_cosine: 0.92

memory:
  db_path: "data/memory/memory.db"
  chroma_path: "data/memory/chroma"
  collection: "arona_memory"
  retrieve_top_k: 3
  candidate_top_k: 10
  min_score: 0.35
  min_score_no_overlap: 0.60
  max_inject_chars: 400
  inject_cooldown_sec: 3600
  inject_cooldown_bypass_score: 0.55
  extract_context_top_k: 8
  extract_context_max_items: 24
  extract_conflict_min_score: 0.70
  reconcile_enabled: true
  reconcile_min_score: 0.82
  reconcile_top_k: 5
  dedup_enabled: true
  dedup_min_score: 0.88
  extractor:
    enabled: true
    base_url: "https://api.deepseek.com"
    api_key: "YOUR_DEEPSEEK_API_KEY"
    model: "deepseek-flash"
    timeout_sec: 15
    max_calls_per_day: 512
    every_n_turns: 6
    extract_buffer_turns: 6
    fallback: "regex"

planner:
  enabled: true
  base_url: "https://api.deepseek.com"
  api_key: "YOUR_DEEPSEEK_API_KEY"
  model: "deepseek-flash"
  timeout_sec: 20
  temperature: 0.8
  max_tokens: 512
  thinking: false
  vision_model: "deepseek-flash"
  router_enabled: true
  router_timeout_sec: 3
  router_max_tokens: 64

listen:
  silence_commit_ms: 1000
  incomplete_commit_ms: 1800
  continuation_window_sec: 8

proactive:
  welcome:
    enabled: true
    persist_path: "data/memory/welcome.json"
  relationship:
    enabled: true
    persist_path: "data/memory/relationship.json"
    alpha: 0.3
    beta: 0.02
    daily_abs_cap: 0.35
    makeup_tension: 0.7
    makeup_trust_scale: 1.5
    cling_dependence: 0.55
    high_dependence: 0.7
    climate_stick_turns: 3
    baseline_trust: 0.55
    baseline_dependence: 0.30
    baseline_tension: 0.25
  idle:
    enabled: true
    after_sec: 1800
    cooldown_sec: 3600
    max_per_day: 3
  care:
    enabled: true
    persist_path: "data/memory/proactive.json"
    breakfast_start: "06:30"
    breakfast_end: "08:00"
    lunch_start: "11:30"
    lunch_end: "13:00"
    dinner_start: "17:30"
    dinner_end: "19:00"
    sleep_start: "23:00"
    sleep_end: "23:20"
  goal:
    enabled: true
    min_after_user_sec: 300
    cooldown_sec: 21600
    important_horizon_hours: 36
    important_cooldown_sec: 1800
    due_soon_sec: 3600
    mute_sec: 604800
    max_per_day: 1
  continue:
    enabled: true
    delay_sec: 2
  festival:
    enabled: true

stance:
  enabled: true
  persist_path: "data/memory/stance.json"
  history_days: 14
  promote_days: 3
  demote_days: 30
  patch_max_chars: 200
  timeout_sec: 120

life:
  enabled: true
  persist_path: "data/memory/life.json"
  journal_path: "data/memory/life_journal.json"
  arona_memory_path: "data/memory/arona.json"
  tick_sec: 5
  look_hold_sec: 60
  think_hold_sec: 120
  glance_interval_sec: 1200
  thought:
    enabled: true
    thinking: false
    persist_path: "data/memory/thought.json"
    notes_max: 8
    notes_max_age_hours: 24
    tick_sec: 60
    revisit_after_sec: 1200
    spontaneous_online_min_sec: 240
    spontaneous_online_max_sec: 600
    spontaneous_away_min_sec: 600
    spontaneous_away_max_sec: 1200
    spontaneous_night_min_sec: 1200
    spontaneous_night_max_sec: 2400
    refractory_sec: 180
    simmer_sec: 30
    impulse_priority: 30
    aftertaste_min_sec: 120
    aftertaste_max_sec: 180
    arrived_fallback_sec: 20

interact:
  enabled: true

computer_use:
  enabled: true
  probe_enabled: true
  probe_token: "__cu_probe__"
  observation_timeout_sec: 8
  max_steps: 64
  route_timeout_sec: 10
  vision_timeout_sec: 240
  vision_max_tokens: 32768
  vision_thinking: true

token_budget:
  memory: 250
  knowledge: 250
  history: 700

logging:
  dir: "logs"
  filename: "arona-backend.log"
  level: "INFO"
  max_bytes: 10485760
  backup_count: 5

napcat:
  # 老师的 QQ 号。空则只挂反向 WebSocket，不收不发私聊
  user_qq_id: ""
  # Napcat 作为客户端连入的路径，与桌面客户端 /ws 共用 server.port
  napcat_ws_path: "/arona"
  # Napcat websocket client 的 token，对应 Authorization: Bearer。与 server.token 分开
  napcat_token: ""
